```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudentHub Portal</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>

    <div class="navbar">
        <a href="Home.html">Home</a>
        <a href="About.html">About</a>
        <a href="Dashboard.html">Dashboard</a>
        <a href="Event.html">Events</a>
        <a href="Profile.html">Profile</a>
        <a href="Contact.html">Contact</a>
        <a href="Admin.html">Admin</a>
        <a href="Faq.html">FAQ</a>
        <a href="Register.html">Register</a>
        <a href="Login.html" id="LoginLogout">Login</a>
    </div>

    <div class="login">
        <h1>Student Login</h1>
        <p>Enter your Enrollment Number and Password</p>
    </div>

    <div class="form">
        <form id="loginForm" action="login.php" method="POST">
            <label for="identity">Enrollment Number</label>
            <input type="text" id="identity" name="identity"
                   placeholder="e.g. 25DIT001"
                   pattern="[0-9]{2}[A-Za-z]{3}[0-9]{3}"
                   title="Enter an enrollment number like 25DIT001"
                   required>

            <br><br>

            <label for="password">Password</label>
            <div class="passwordBox">
                <input type="password" id="password" name="password" required>
                <button type="button" id="showPassword">👁</button>
            </div>

            <br>

            <label>
                <input type="checkbox" name="remember" value="yes">
                Remember Me
            </label>

            <br><br>

            <button type="submit">Login</button>
            <button type="reset">Clear</button>
        </form>
    </div>

    <script src="Login.js"></script>
</body>
</html>
